<div class="card" style="margin-bottom:var(--spacing-md); padding:10px 16px;">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <div>
            <h2 style="margin:0;font-size:14px;color:var(--text-primary); text-transform:uppercase;"><i class="fas fa-cog" style="color:var(--primary);margin-right:8px"></i>System Configuration</h2>
        </div>
        <button type="button" class="btn btn-primary btn-sm" :disabled="settingsLoading" @click="saveSettings()">
            <i class="fas fa-spinner fa-spin" x-show="settingsLoading"></i>
            <i class="fas fa-save" x-show="!settingsLoading"></i>
            <span x-text="settingsLoading ? 'SAVING...' : 'SAVE CONFIG'"></span>
        </button>
    </div>
</div>

<div class="dashboard-grid" style="grid-template-columns: 1fr 1fr; gap: 10px;">
    <div class="card" style="margin-bottom:0">
        <div class="card-header" style="margin-bottom:8px">
            <h2 class="card-title" style="font-size:12px; text-transform:uppercase;"><i class="fas fa-network-wired" style="margin-right:6px;color:#0EA5E9"></i>LACP & Network</h2>
        </div>
        <div style="padding: 0;">
            <div class="form-group" style="margin-bottom:12px">
                <label class="form-label" style="font-size:11px; text-transform:uppercase">Partition Strategy</label>
                <select class="form-select" x-model="settingsForm.lacp_priority" style="font-size:12px; padding:6px 10px">
                    <option value="latency">Latency Priority (LAN/Tailscale)</option>
                    <option value="vram">VRAM Priority (Large Models)</option>
                    <option value="compute">Compute Priority (TFLOPS)</option>
                </select>
            </div>
            
            <div class="form-group" style="margin-bottom:12px">
                <label class="form-label" style="font-size:11px; text-transform:uppercase">Max Ping Latency (ms)</label>
                <div style="display:flex;align-items:center;gap:10px">
                    <input type="range" class="form-range" min="10" max="500" step="10" x-model.number="settingsForm.lacp_max_ping" style="flex:1">
                    <span style="font-family:monospace;font-size:12px;width:40px" x-text="settingsForm.lacp_max_ping || 100"></span>
                </div>
            </div>

            <div class="form-group" style="margin-bottom:0">
                <label class="form-label" style="font-size:11px; text-transform:uppercase">Discovery Mode (Requires Restart)</label>
                <select class="form-select" x-model="settingsForm.discovery_module" style="font-size:12px; padding:6px 10px">
                    <option value="tailscale">Tailscale VPN</option>
                    <option value="udp">UDP Broadcast</option>
                    <option value="manual">Manual (Static)</option>
                </select>
            </div>
        </div>
    </div>

    <div class="card" style="margin-bottom:0">
        <div class="card-header" style="margin-bottom:8px">
            <h2 class="card-title" style="font-size:12px; text-transform:uppercase;"><i class="fas fa-shield-alt" style="margin-right:6px;color:#EF4444"></i>API Security</h2>
        </div>
        <div style="padding: 0;">
            <div class="form-group" style="margin-bottom:12px">
                <label class="form-label" style="font-size:11px; text-transform:uppercase">API Auth</label>
                <select class="form-select" x-model="settingsForm.api_auth_enabled" style="font-size:12px; padding:6px 10px">
                    <option value="false">Disabled (Public)</option>
                    <option value="true">Enabled (Bearer Token)</option>
                </select>
            </div>
            <div class="form-group" style="margin-bottom:12px" x-show="settingsForm.api_auth_enabled === 'true'">
                <label class="form-label" style="font-size:11px; text-transform:uppercase">Bearer Token</label>
                <input type="password" class="form-input" x-model="settingsForm.api_key" placeholder="sk-..." style="font-size:12px; padding:6px 10px">
            </div>
            <div class="form-group" style="margin-bottom:0">
                <label class="form-label" style="font-size:11px; text-transform:uppercase">CORS Origins</label>
                <input type="text" class="form-input" x-model="settingsForm.cors_origins" placeholder="*, http://localhost:3000" style="font-size:12px; padding:6px 10px">
            </div>
        </div>
    </div>

    <div class="card" style="margin-bottom:0;grid-column: 1 / -1">
        <div class="card-header" style="margin-bottom:8px">
            <h2 class="card-title" style="font-size:12px; text-transform:uppercase;"><i class="fas fa-sliders-h" style="margin-right:6px;color:#10B981"></i>General</h2>
        </div>
        <div style="padding: 0; display:flex; gap:20px;">
            <div class="form-group" style="flex:1; margin-bottom:0">
                <label class="form-label" style="font-size:11px; text-transform:uppercase">Default Startup Model</label>
                <select class="form-select" x-model="settingsForm.default_model" style="font-size:12px; padding:6px 10px">
                    <option value="">-- None --</option>
                    <template x-for="m in modelList.downloaded" :key="m.name">
                        <option :value="m.name" x-text="m.name"></option>
                    </template>
                </select>
            </div>
            <div class="form-group" style="flex:1; margin-bottom:0">
                <label class="form-label" style="font-size:11px; text-transform:uppercase">UI Theme</label>
                <select class="form-select" x-model="settingsForm.theme" @change="applyTheme(settingsForm.theme)" style="font-size:12px; padding:6px 10px">
                    <option value="dark">Dark Mode (Strictly Recommended)</option>
                    <option value="light">Light Mode</option>
                </select>
            </div>
        </div>
    </div>
</div>
