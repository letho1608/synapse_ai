<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <div>
        <h2 style="margin:0;font-size:18px;color:var(--text-primary)"><i class="fas fa-flask" style="color:var(--info);margin-right:8px"></i>Kiểm thử & Benchmarking</h2>
        <p class="text-muted" style="margin:4px 0 0 0;font-size:13px">Giao diện Chat và đo lường thông lượng Inference (TTFT, Tokens/sec).</p>
    </div>
</div>

<div style="display:grid;grid-template-columns:300px 1fr;gap:20px;height:calc(100vh - 160px)">
    <!-- Sidebar: Cấu hình tham số -->
    <div class="card" style="margin-bottom:0;display:flex;flex-direction:column;overflow-y:auto">
        <div class="card-header">
            <h3 class="card-title" style="font-size:14px"><i class="fas fa-sliders-h" style="margin-right:6px"></i>Tham số Inference</h3>
        </div>
        <div class="form-group" style="margin-bottom:12px">
            <label class="form-label">Chọn Model</label>
            <select class="form-select" x-model="selectedModel" title="Chọn model">
                <option value="">-- Chọn model --</option>
                <template x-for="m in modelList.downloaded" :key="m.name">
                    <option :value="m.name" x-text="m.name"></option>
                </template>
            </select>
        </div>
        
        <div class="form-group" style="margin-bottom:12px">
            <label class="form-label" style="display:flex;justify-content:space-between">
                <span>Temperature</span>
                <span x-text="Number(testTemperature).toFixed(2)"></span>
            </label>
            <input type="range" class="form-range" min="0" max="2" step="0.1" x-model.number="testTemperature">
        </div>

        <div class="form-group" style="margin-bottom:12px">
            <label class="form-label" style="display:flex;justify-content:space-between">
                <span>Top P</span>
                <span x-text="Number(testTopP || 0.9).toFixed(2)"></span>
            </label>
            <input type="range" class="form-range" min="0" max="1" step="0.05" x-model.number="testTopP">
        </div>

        <div class="form-group" style="margin-bottom:12px">
            <label class="form-label" style="display:flex;justify-content:space-between">
                <span>Top K</span>
                <span x-text="testTopK || 40"></span>
            </label>
            <input type="range" class="form-range" min="1" max="100" step="1" x-model.number="testTopK">
        </div>

        <div class="form-group" style="margin-bottom:12px">
            <label class="form-label" style="display:flex;justify-content:space-between">
                <span>Repetition Penalty</span>
                <span x-text="Number(testRepPenalty || 1.1).toFixed(2)"></span>
            </label>
            <input type="range" class="form-range" min="1" max="2" step="0.05" x-model.number="testRepPenalty">
        </div>

        <div class="form-group" style="margin-bottom:12px">
            <label class="form-label">Max Tokens</label>
            <input type="number" class="form-input" x-model.number="testMaxTokens" placeholder="Ex: 2048">
        </div>

        <div style="margin-top:auto;border-top:1px solid var(--border-color);padding-top:12px">
            <button type="button" class="btn btn-outline" style="width:100%" @click="testChatMessages = []" :disabled="isTesting">
                <i class="fas fa-trash-alt"></i> Xóa hội thoại
            </button>
        </div>
    </div>

    <!-- Main Chat Window -->
    <div class="card" style="margin-bottom:0;display:flex;flex-direction:column">
        <!-- Benchmark Live Stats (Header) -->
        <div style="padding:10px 16px;background:var(--bg-secondary);border-bottom:1px solid var(--border-color);display:flex;gap:20px;font-size:12px">
            <div><span class="text-muted">TTFT:</span> <strong style="color:var(--primary)" x-text="currentBenchmark.ttft ? currentBenchmark.ttft.toFixed(2) + 's' : '-'"></strong></div>
            <div><span class="text-muted">Tốc độ:</span> <strong style="color:var(--success)" x-text="currentBenchmark.tps ? currentBenchmark.tps.toFixed(1) + ' t/s' : '-'"></strong></div>
            <div><span class="text-muted">Tổng thời gian:</span> <strong x-text="currentBenchmark.totalTime ? currentBenchmark.totalTime.toFixed(2) + 's' : '-'"></strong></div>
            <div><span class="text-muted">Output Tokens:</span> <strong x-text="currentBenchmark.tokens || '-'"></strong></div>
        </div>

        <!-- Chat Area -->
        <div id="chat-messages" class="chat-messages" style="flex:1;overflow-y:auto;padding:20px" x-ref="chatMessages">
            <template x-if="testChatMessages.length === 0">
                <div class="chat-placeholder" style="text-align:center;padding:40px">
                    <i class="fas fa-robot text-muted" style="font-size:3rem;margin-bottom:16px;opacity:0.3"></i>
                    <p class="text-muted">Công cụ Chat Benchmark đã sẵn sàng.<br>Bắt đầu trò chuyện để đo lường thông lượng Inference thực tế.</p>
                </div>
            </template>
            <template x-for="(msg, idx) in testChatMessages" :key="idx">
                <div class="chat-msg" :class="msg.role === 'user' ? 'chat-msg-user' : 'chat-msg-assistant'">
                    <div class="chat-msg-avatar" x-show="msg.role === 'assistant'"><i class="fas fa-robot"></i></div>
                    <div class="chat-msg-bubble">
                        <div class="chat-msg-content markdown" x-html="renderMarkdown(msg.content)" style="white-space: normal;"></div>
                        <div class="chat-msg-usage text-muted" x-show="msg.usage" x-text="msg.usage"></div>
                    </div>
                    <div class="chat-msg-avatar chat-msg-avatar-user" x-show="msg.role === 'user'"><i class="fas fa-user"></i></div>    
                </div>
            </template>
            <div class="chat-msg chat-msg-assistant" x-show="isTesting">
                <div class="chat-msg-avatar"><i class="fas fa-robot"></i></div>
                <div class="chat-msg-bubble"><span class="text-muted"><i class="fas fa-spinner fa-spin"></i> Đang sinh Token...</span></div>
            </div>
        </div>

        <!-- Chat Input -->
        <div class="chat-input-wrap" style="padding:16px;border-top:1px solid var(--border-color);display:flex;gap:10px">
            <textarea class="chat-input" rows="1" style="flex:1"
                placeholder="Nhập prompt... (Enter gửi, Shift+Enter xuống dòng)"
                x-model="testInput"
                @keydown.enter="if (!$event.shiftKey) { $event.preventDefault(); if (isTesting) cancelTest(); else if (selectedModel && testInput.trim()) runTest(); }"
                :disabled="isTesting"></textarea>
            <button type="button" class="btn"
                :class="isTesting ? 'btn-danger' : 'btn-primary'"
                @click="isTesting ? cancelTest() : runTest()"
                :disabled="!isTesting && (!selectedModel || !testInput.trim())"
                style="min-width:60px">
                <i class="fas fa-paper-plane" x-show="!isTesting"></i>
                <i class="fas fa-stop" x-show="isTesting"></i>
            </button>
        </div>
    </div>
</div>
