# Two Synapse nodes on one machine, each in its own container (own IP and
# network stack), finding each other by UDP broadcast like two LAN machines.
#
#   docker compose -f docker/docker-compose.yml up -d --build
#   web UI: http://127.0.0.1:52416 (node A), http://127.0.0.1:52417 (node B)
#
# Simulate a bad link on one node (needs NET_ADMIN, granted below):
#   docker exec synapse-b tc qdisc add dev eth0 root netem delay 50ms loss 5%
#   docker exec synapse-b tc qdisc del dev eth0 root
#
# Models come from docker/hf-cache, a cache used only by these containers
# (gitignored). Fill it once from the host:
#   python -c "from huggingface_hub import snapshot_download as d; d('HuggingFaceTB/SmolLM2-135M-Instruct', cache_dir='docker/hf-cache/hub', allow_patterns=['*.json','*.safetensors','*.txt','*.model'])"
# Never mount the host's real ~/.cache/huggingface here: on 2026-11-04 it was
# found empty after a run that mounted it (cause not established).

x-node: &node
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: synapse-node
  cap_add: [NET_ADMIN]
  environment:
    HF_HUB_OFFLINE: "1"
  volumes:
    - ./hf-cache:/root/.cache/huggingface
  networks: [lan]
  mem_limit: 2g

services:
  a:
    <<: *node
    container_name: synapse-a
    hostname: synapse-a
    command: ["--node-id", "A"]
    ports: ["52416:52415"]
  b:
    <<: *node
    container_name: synapse-b
    hostname: synapse-b
    command: ["--node-id", "B"]
    ports: ["52417:52415"]
  # third node, for partition tests (docker/partition_scenarios.py):
  #   docker compose -f docker/docker-compose.yml --profile three up -d
  c:
    <<: *node
    container_name: synapse-c
    hostname: synapse-c
    command: ["--node-id", "C"]
    ports: ["52418:52415"]
    profiles: ["three"]

networks:
  lan:
    driver: bridge
