services:
  synapse-ai:
    build: .
    container_name: synapse-ai
    image: synapse-ai:latest
    restart: unless-stopped
    command: python main.py run --default-model qwen2.5:0.5b --discovery-module udp
    ports:
      - "50051:50051"
      - "5678:5678/udp"
      - "5678:5678/tcp"
      - "52415:52415"
    volumes:
      - .:/app
      - synapse-models:/root/.cache/huggingface
      - synapse-checkpoints:/app/checkpoints
    env_file:
      - .env
    environment:
      - NODE_PORT=50051
      - CHATGPT_API_PORT=52415
      - HF_HUB_DISABLE_SYMLINKS=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  synapse-models:
  synapse-checkpoints:
